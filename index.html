<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jutsu Typing Dojo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bangers&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3efe4;--fg:#16130e;--accent:#d4281a;--rule:rgba(22,19,14,.09);--muted:#6b645a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14120f;--fg:#f0eadb;--accent:#ff5440;--rule:rgba(240,234,219,.09);--muted:#a39b8c}}
:root[data-theme="dark"]{--bg:#14120f;--fg:#f0eadb;--accent:#ff5440;--rule:rgba(240,234,219,.09);--muted:#a39b8c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
#app{height:100%;display:flex;flex-direction:column;gap:10px;padding:14px;max-width:1100px;margin:0 auto;box-sizing:border-box}
#bar{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px 20px;font:1.5rem Bangers,Impact,sans-serif;letter-spacing:.05em}
#bar b{color:var(--accent);font-weight:400}
#field{position:relative;flex:1;min-height:300px;border:3px solid var(--fg);overflow:hidden;
background-image:repeating-linear-gradient(0deg,transparent 0 calc(20% - 1px),var(--rule) calc(20% - 1px) 20%)}
#field.shake{animation:sh .2s}
@keyframes sh{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
#pl{position:absolute;left:0;top:0;bottom:0;width:80px;border-right:3px solid var(--accent);display:grid;place-items:center;font-size:2.4rem;
background:repeating-linear-gradient(135deg,transparent 0 6px,var(--rule) 6px 7px)}
.en{position:absolute;left:0;top:calc(var(--l)*20%);height:20%;display:flex;align-items:center;gap:8px;will-change:transform}
.nin{width:30px;height:30px;border-radius:50%;background:var(--fg);position:relative;flex:none}
.nin::after{content:"";position:absolute;left:4px;right:4px;top:11px;height:6px;background:var(--bg);border-radius:3px}
.bub{background:var(--bg);border:2px solid var(--fg);border-radius:10px;padding:2px 10px;font:700 1.2rem ui-monospace,Menlo,Consolas,monospace;white-space:nowrap}
.en.t .bub{border-color:var(--accent);box-shadow:3px 3px 0 var(--accent)}
.d{color:var(--accent)}
.en.dead{opacity:0;transition:opacity .25s}
.slash{position:absolute;height:5px;width:200px;background:var(--accent);transform-origin:left center;animation:sl .28s forwards;pointer-events:none}
@keyframes sl{from{transform:rotate(-18deg) scaleX(0);opacity:1}to{transform:rotate(-18deg) scaleX(1);opacity:0}}
#ov{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:20px;background:color-mix(in srgb,var(--bg) 92%,transparent)}
#ov h1{font:3.4rem/1 Bangers,Impact,sans-serif;letter-spacing:.05em;margin:0 0 10px}
#ov p{margin:6px auto;max-width:44ch;line-height:1.5}
#ov small{color:var(--muted)}
#hist{list-style:none;margin:12px auto 0;padding:0;max-width:30ch;text-align:left;font:1rem ui-monospace,Menlo,Consolas,monospace}
#hist li{display:flex;justify-content:space-between;gap:12px;padding:2px 0;border-bottom:1px solid var(--rule)}
#hist li.top b{color:var(--accent)}
button{font:1.5rem Bangers,Impact,sans-serif;letter-spacing:.06em;margin-top:14px;padding:8px 26px;color:var(--bg);background:var(--fg);border:3px solid var(--fg);cursor:pointer}
button:hover{background:var(--accent);border-color:var(--accent)}
button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
@media(prefers-reduced-motion:reduce){#field.shake,.slash{animation:none}}
</style>
</head>
<body>
<div id="app">
  <div id="bar">
    <span>Score <b id="sc">0</b></span>
    <span>Combo <b id="cb">0</b></span>
    <span>Rank <b id="rk">Genin</b></span>
    <span>Best <b id="bs">0</b></span>
    <span>Lives <b id="lv"></b></span>
  </div>
  <div id="field">
    <div id="pl" aria-hidden="true">忍</div>
    <div id="ov">
      <div>
        <h1 id="ovT">Jutsu Typing Dojo</h1>
        <p id="ovP">Enemy ninjas march toward you, each carrying a jutsu name. Type the name to strike them down before they cross the red line.</p>
        <p><small>Esc drops your current target. A mistake resets your combo. Needs a physical keyboard.</small></p>
        <ol id="hist"></ol>
        <button id="go">Begin</button>
      </div>
    </div>
  </div>
</div>
<script>
const W={
 s:["kunai","chakra","scroll","ninja","genin","anbu","jutsu","seal","mask","toad","snake","leaf","sand","mist","rain","cloud","stone","smoke","shadow","flash","clone","sensei"],
 m:["shuriken","sharingan","byakugan","rasengan","chidori","akatsuki","hokage","kazekage","mizukage","raikage","summoning","fireball","waterdragon","puppet","sage","konoha"],
 l:["kagebunshin","amaterasu","susanoo","tsukuyomi","edotensei","rinnegan","hiraishin","substitution","tailedbeast","kamui","izanagi","fuinjutsu"]
};
const RANKS=[["Genin",0],["Chunin",600],["Jonin",1800],["Kage",4000]];
const $=id=>document.getElementById(id), field=$("field"), ov=$("ov");
let st="idle",enemies=[],target=null,score=0,combo=0,lives=3,last=0,spawnT=0,t=0,best=0;
let hist=[],maxCombo=0;
try{best=+localStorage.getItem("typingBest")||0;hist=JSON.parse(localStorage.getItem("typingHist")||"[]")}catch(e){}
function renderHist(){
  $("hist").innerHTML=hist.length?hist.map(h=>`<li class="${h.s===best?"top":""}"><span>${h.r}</span><b>${h.s}</b></li>`).join(""):"";
}
const rank=()=>{let r=0;RANKS.forEach((x,i)=>{if(score>=x[1])r=i});return r};
function hud(){
  $("sc").textContent=score;$("bs").textContent=Math.max(best,score);$("cb").textContent=combo;$("rk").textContent=RANKS[rank()][0];
  $("lv").textContent="●".repeat(lives)+"○".repeat(3-lives);
}
function pickWord(){
  const r=rank(),pool=r==0?W.s:r==1?[...W.s,...W.m]:[...W.m,...W.l];
  const used=enemies.map(e=>e.w[0]),opts=pool.filter(w=>!used.includes(w[0])&&!enemies.some(e=>e.w===w));
  const p=opts.length?opts:pool;return p[Math.random()*p.length|0];
}
function draw(e){
  e.bub.innerHTML=`<span class="d">${e.w.slice(0,e.typed)}</span>${e.w.slice(e.typed)}`;
  e.el.classList.toggle("t",e===target);
}
function spawn(){
  const fw=field.clientWidth,taken=enemies.filter(e=>e.x>fw-220).map(e=>e.lane);
  const free=[0,1,2,3,4].filter(l=>!taken.includes(l));if(!free.length)return;
  const lane=free[Math.random()*free.length|0],el=document.createElement("div");
  el.className="en";el.style.setProperty("--l",lane);
  el.innerHTML='<i class="nin"></i><span class="bub"></span>';
  field.appendChild(el);
  const e={el,bub:el.lastChild,w:pickWord(),typed:0,x:fw,lane,v:(55+rank()*14+Math.min(t/12,40))*(.85+Math.random()*.3)};
  enemies.push(e);draw(e);
}
function drop(e){enemies=enemies.filter(x=>x!==e);if(target===e)target=null}
function kill(e){
  drop(e);
  const s=document.createElement("div");s.className="slash";
  s.style.left=Math.max(e.x,90)+"px";s.style.top=`calc(${e.lane*20+10}% )`;field.appendChild(s);
  e.el.classList.add("dead");
  setTimeout(()=>{e.el.remove();s.remove()},300);
  combo++;maxCombo=Math.max(maxCombo,combo);score+=e.w.length*10*(1+Math.floor(combo/5));hud();
}
function shake(){field.classList.remove("shake");void field.offsetWidth;field.classList.add("shake")}
function miss(){combo=0;shake();hud()}
function leak(e){
  if(st!=="play")return;
  drop(e);e.el.remove();combo=0;lives--;shake();hud();
  if(lives<=0)over();
}
function loop(ts){
  if(st!=="play")return;
  const dt=Math.min((ts-last)/1000,.05);last=ts;t+=dt;spawnT-=dt;
  if(spawnT<=0){spawn();spawnT=Math.max(.75,2.4-rank()*.4-t/90)*(.8+Math.random()*.4)}
  for(const e of [...enemies]){e.x-=e.v*dt;e.el.style.transform=`translateX(${e.x}px)`;if(e.x<80)leak(e)}
  requestAnimationFrame(loop);
}
function start(){
  if(st==="play")return;
  enemies.forEach(e=>e.el.remove());enemies=[];target=null;
  score=0;combo=0;maxCombo=0;lives=3;t=0;spawnT=.6;hud();
  ov.style.display="none";st="play";document.activeElement.blur();
  last=performance.now();requestAnimationFrame(loop);
}
function over(){
  st="over";
  const rec=score>best;if(rec)best=score;
  hist.unshift({s:score,r:RANKS[rank()][0]});hist=hist.slice(0,5);
  try{localStorage.setItem("typingBest",best);localStorage.setItem("typingHist",JSON.stringify(hist))}catch(e){}
  renderHist();
  $("ovT").textContent="Defeated";
  $("ovP").textContent=`Score ${score}, rank ${RANKS[rank()][0]}, best combo ${maxCombo}. ${rec?"New best!":"Best: "+best+"."}`;
  $("go").textContent="Fight again";ov.style.display="grid";
}
$("go").onclick=start;
addEventListener("keydown",ev=>{
  if(st!=="play"){if(ev.key==="Enter")start();return}
  if(ev.key==="Escape"){if(target){const o=target;target=null;o.typed=0;draw(o)}return}
  if(ev.ctrlKey||ev.metaKey||ev.altKey||ev.key.length!==1)return;
  const k=ev.key.toLowerCase();if(!/[a-z]/.test(k))return;
  if(!target){
    const c=enemies.filter(e=>e.w[0]===k).sort((a,b)=>a.x-b.x)[0];
    if(!c){miss();return}
    target=c;
  }
  if(target.w[target.typed]===k){
    target.typed++;
    if(target.typed===target.w.length)kill(target);else draw(target);
  }else miss();
});
hud();renderHist();
</script>
</body>
</html>
